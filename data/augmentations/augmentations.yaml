independent_augs: true
augmentations:
  brightness_contrast:
    brightness_limit: [-0.15, 0.15]
    contrast_limit: [-0.15, 0.15]
    probability: 0.1

  crop:
    ratio: [0.85, 0.95]
    probability: 0.1
    is_geometric: true

  gamma:
    gamma_limit: [70, 140]
    probability: 0.09

  gaussian_blur:
    sigma_limit: [0.8, 1.8]
    probability: 0.07

  hue_saturation:
    hue: [-0.04, 0.04]
    saturation: [0.8, 1.2]
    probability: 0.1

  motion_blur:
    blur_limit: [3, 5]
    probability: 0.05

  occlusion:
    area_pct: [0.08, 0.15]
    min_holes: 1
    max_holes: 2
    probability: 0.09

  rotation:
    limit: [-8, 8]
    probability: 0.1
    is_geometric: true

  scale:
    scale: [0.95, 1.15]
    probability: 0.1
    is_geometric: true

  shadow:
    shadow_dimension: 4
    probability: 0.09

  translation:
    translate_percent: [-0.05, 0.05]
    probability: 0.08
    is_geometric: true
