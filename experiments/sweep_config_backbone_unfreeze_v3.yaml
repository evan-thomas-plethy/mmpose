# =============================================================================
# Sweep v3 — backbone unfreeze ladder (layer decay ld0.5)
# =============================================================================
# seed2_n1000 dataset; frozen_stages controls unfreeze depth:
#   frozen_stages=3  -> train stage4 only   (seed2_n1000_unfreeze_stage4_ld0.5)
#   frozen_stages=2  -> train stage3 + stage4 (seed2_n1000_unfreeze_stage34_ld0.5)
#   frozen_stages=-1 -> train entire backbone (seed2_n1000_unfreeze_full_ld0.5)
#
# CSPNeXtLayerDecayOptimWrapperConstructor (backbone_top_lr_mult=0.1, ld=0.5).
#
# Run with: python experiments/run_sweep.py experiments/sweep_config_backbone_unfreeze_v3.yaml
# =============================================================================

base_config: "configs/body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_coco-256x192_finetune_unfreeze.py"

mlflow:
  tracking_uri: "http://52.41.68.196:5000"
  experiment_name: "rtmpose-m_merged_gbe_v6_lspe_sweep"

experiments:
  - name: "seed2_n1000_unfreeze_stage4_ld0.5"
    overrides:
      model.backbone.frozen_stages: 3
      train_dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/"
      val_dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/"
      val_evaluator.ann_file: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/annotations/person_keypoints_val2017.json"
      custom_hooks.2.dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/"
      custom_hooks.2.evaluator.ann_file: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/annotations/person_keypoints_val2017_mirrored.json"

  - name: "seed2_n1000_unfreeze_stage34_ld0.5"
    overrides:
      model.backbone.frozen_stages: 2
      train_dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/"
      val_dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/"
      val_evaluator.ann_file: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/annotations/person_keypoints_val2017.json"
      custom_hooks.2.dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/"
      custom_hooks.2.evaluator.ann_file: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/annotations/person_keypoints_val2017_mirrored.json"

  - name: "seed2_n1000_unfreeze_full_ld0.5"
    overrides:
      model.backbone.frozen_stages: -1
      train_dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/"
      val_dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/"
      val_evaluator.ann_file: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/annotations/person_keypoints_val2017.json"
      custom_hooks.2.dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/"
      custom_hooks.2.evaluator.ann_file: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed2_n1000/annotations/person_keypoints_val2017_mirrored.json"
