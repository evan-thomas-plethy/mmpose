# =============================================================================
# Sweep v2 — single run: merged GBE v6 + Lying Person (full unfreeze, ld0.5)
# =============================================================================
# One run on the full Lying Person merge (all component2 images). Hyperparams
# match v1 InfiniteForm sweep baseline: frozen_stages=-1, CSPNeXtLayerDecay ld0.5
#
# Prerequisites:
#   python data/merge_with_seed.py data/coco_ground_based_exercises_v6 \
#     data/Lying_Person_Dataset_Single_Ann/v1 \
#     --seed 3 --n-component2 736 \
#     --output data/merged_gbe_v6_lyingperson/gbe_v6_lyingperson --force
#
# Run with:
#   python experiments/run_sweep.py experiments/sweep_config_merged_gbe_v6_various_datasets_sweep_v2.yaml
# =============================================================================

base_config: "configs/body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_coco-256x192_finetune_unfreeze.py"

mlflow:
  tracking_uri: "http://52.41.68.196:5000"
  experiment_name: "rtmpose-m_merged_gbe_v6_various_datasets_sweep"

experiments:
  - name: "lyingperson_unfreeze_full_ld0.5"
    overrides:
      model.backbone.frozen_stages: -1
      train_dataloader.dataset.data_root: "data/merged_gbe_v6_lyingperson/gbe_v6_lyingperson/"
      val_dataloader.dataset.data_root: "data/merged_gbe_v6_lyingperson/gbe_v6_lyingperson/"
      val_evaluator.ann_file: "data/merged_gbe_v6_lyingperson/gbe_v6_lyingperson/annotations/person_keypoints_val2017.json"
      custom_hooks.2.dataloader.dataset.data_root: "data/merged_gbe_v6_lyingperson/gbe_v6_lyingperson/"
      custom_hooks.2.evaluator.ann_file: "data/merged_gbe_v6_lyingperson/gbe_v6_lyingperson/annotations/person_keypoints_val2017_mirrored.json"
