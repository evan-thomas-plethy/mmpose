# =============================================================================
# Sweep v5 — seed 3/4/5 × n1000/n2000 merged datasets (full unfreeze, ld0.5)
# =============================================================================
# One run per merged GBE v6 + LSPe dataset produced by merge_with_seed.py
# (seeds 3–5, n_component2 1000 and 2000). Hyperparams match v3 baseline:
#   seed2_n1000_unfreeze_full_ld0.5  (frozen_stages=-1, CSPNeXtLayerDecay ld0.5)
#
# Prerequisites:
#   for seed in 3 4 5; do for n in 1000 2000; do
#     python data/merge_with_seed.py data/coco_ground_based_exercises_v6 data/LSPe \
#       --seed "$seed" --n-component2 "$n" \
#       --output "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed${seed}_n${n}" --force
#   done; done
#
# Run with: python experiments/run_sweep.py experiments/sweep_config_backbone_unfreeze_v5.yaml
# =============================================================================

base_config: "configs/body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_coco-256x192_finetune_unfreeze.py"

mlflow:
  tracking_uri: "http://52.41.68.196:5000"
  experiment_name: "rtmpose-m_merged_gbe_v6_lspe_sweep"

experiments:
  - name: "seed3_n1000_unfreeze_full_ld0.5"
    overrides:
      model.backbone.frozen_stages: -1
      train_dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed3_n1000/"
      val_dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed3_n1000/"
      val_evaluator.ann_file: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed3_n1000/annotations/person_keypoints_val2017.json"
      custom_hooks.2.dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed3_n1000/"
      custom_hooks.2.evaluator.ann_file: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed3_n1000/annotations/person_keypoints_val2017_mirrored.json"

  - name: "seed3_n2000_unfreeze_full_ld0.5"
    overrides:
