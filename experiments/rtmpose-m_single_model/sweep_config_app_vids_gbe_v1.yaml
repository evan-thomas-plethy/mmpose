# =============================================================================
# Six App Vids + GBE splits. Annotations live in each dataset directory.
# Frames for train and val are read from data/App_Vids_v1_GBE_v1_frames/.
# =============================================================================
# Datasets:
#   App_Vids_v2_GBE_v4_val10
#   App_Vids_v2_GBE_v5_val10
#   App_Vids_v3_GBE_v5_val10
#   App_Vids_v2_GBE_v4_val10_subject25
#   App_Vids_v2_GBE_v5_val10_subject25
#   App_Vids_v3_GBE_v5_val10_subject25
#
# Run with:
#   python experiments/run_sweep.py experiments/rtmpose-m_single_model/sweep_config_app_vids_gbe_v1.yaml
# =============================================================================

base_config: "configs/body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_coco-256x192_finetune.py"

mlflow:
  tracking_uri: "http://52.41.68.196:5000"
  experiment_name: "rtmpose-m_single_model"

experiments:
  - name: "app_vids_v2_gbe_v4_val10"
    overrides:
      train_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_val10/"
      train_dataloader.dataset.data_prefix.img: "../App_Vids_v1_GBE_v1_frames/"
      val_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_val10/"
      val_dataloader.dataset.data_prefix.img: "../App_Vids_v1_GBE_v1_frames/"
      val_evaluator.ann_file: "data/App_Vids_v2_GBE_v4_val10/annotations/person_keypoints_val2017.json"
      test_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_val10/"
