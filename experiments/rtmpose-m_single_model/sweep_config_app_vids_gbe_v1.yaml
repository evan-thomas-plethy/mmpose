# =============================================================================
# Six App Vids + GBE splits. Annotations live in each dataset directory.
# Frames for train and val are read from data/App_Vids_v1_GBE_v1_frames/.
# Mirrored val images live in each dataset's val2017_mirrored/.
# General val is data/webex-general-val/.
# =============================================================================
# Datasets:
#   App_Vids_v2_GBE_v4_val10
#   App_Vids_v2_GBE_v5_val10
#   App_Vids_v3_GBE_v5_val10
#   App_Vids_v2_GBE_v4_val10_subject25
#   App_Vids_v2_GBE_v5_val10_subject25
#   App_Vids_v3_GBE_v5_val10_subject25
#
# Run with:
#   python experiments/run_sweep.py experiments/rtmpose-m_single_model/sweep_config_app_vids_gbe_v1.yaml
#
# Schedule comes from the base config and scales with each dataloader:
#   Linear warmup over epochs 0–2 (1e-6 to 1e-4), then cosine to 1e-6
#   through epoch 30. Both phases update every step.
# =============================================================================

base_config: "experiments/v1.py"

experiment_name: "rtmpose-m_single_model"
# wandb project is rtmpose-m_finetune

experiments:
  - name: "app_vids_v2_gbe_v4_val10"
    overrides:
      train_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_val10/"
      train_dataloader.dataset.data_prefix.img: "../App_Vids_v1_GBE_v1_frames/"
      val_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_val10/"
      val_dataloader.dataset.data_prefix.img: "../App_Vids_v1_GBE_v1_frames/"
      val_evaluator.ann_file: "data/App_Vids_v2_GBE_v4_val10/annotations/person_keypoints_val2017.json"
      test_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_val10/"
      test_dataloader.dataset.data_prefix.img: "../App_Vids_v1_GBE_v1_frames/"
      test_evaluator.ann_file: "data/App_Vids_v2_GBE_v4_val10/annotations/person_keypoints_val2017.json"
      custom_hooks.2.dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_val10/"
      custom_hooks.2.dataloader.dataset.data_prefix.img: "val2017_mirrored/"
      custom_hooks.2.evaluator.ann_file: "data/App_Vids_v2_GBE_v4_val10/annotations/person_keypoints_val2017_mirrored.json"
      custom_hooks.3.dataloader.dataset.data_root: "data/webex-general-val/"
      custom_hooks.3.dataloader.dataset.ann_file: "annotations/general_val.json"
      custom_hooks.3.dataloader.dataset.data_prefix.img: "general_val/"
      custom_hooks.3.evaluator.ann_file: "data/webex-general-val/annotations/general_val.json"

