# =============================================================================
# Backbone unfreeze on App_Vids_v2_GBE_v4_val10_subject25.
# Same val sets as app_vids_v2_gbe_v4_val10_subject25 in
# sweep_config_app_vids_gbe_v1.yaml. Train and val frames are
# data/App_Vids_v1_GBE_v1_frames/. Mirrored val images live in
# val2017_mirrored/. General val is data/webex-general-val/.
#
# For each base LR in {3e-5, 1e-4, 3e-4}:
#   frozen_stages=2  -> train stage3 + stage4
#   frozen_stages=3  -> train stage4 only
# Stage LRs scale with optim_wrapper.optimizer.lr (top stage = 0.1x, then
# 0.5x per stage toward the stem).
#
# Hook indices match finetune.py: custom_hooks.2 is MirroredValHook and
# custom_hooks.3 is GeneralValHook. Primary val is the normal val dataloader.
# =============================================================================
# Run with:
#   python experiments/run_sweep.py experiments/rtmpose-m_single_model/sweep_config_app_vids_gbe_v4.yaml
# =============================================================================

base_config: "configs/body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_coco-256x192_finetune_unfreeze.py"

experiment_name: "rtmpose-m_finetune"

_subject25: &subject25
  train_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_val10_subject25/"
  train_dataloader.dataset.data_prefix.img: "../App_Vids_v1_GBE_v1_frames/"
  val_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_val10_subject25/"
  val_dataloader.dataset.data_prefix.img: "../App_Vids_v1_GBE_v1_frames/"
  val_evaluator.ann_file: "data/App_Vids_v2_GBE_v4_val10_subject25/annotations/person_keypoints_val2017.json"
  test_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_val10_subject25/"
  test_dataloader.dataset.data_prefix.img: "../App_Vids_v1_GBE_v1_frames/"
  test_evaluator.ann_file: "data/App_Vids_v2_GBE_v4_val10_subject25/annotations/person_keypoints_val2017.json"
  custom_hooks.2.dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_val10_subject25/"
  custom_hooks.2.dataloader.dataset.data_prefix.img: "val2017_mirrored/"
  custom_hooks.2.evaluator.ann_file: "data/App_Vids_v2_GBE_v4_val10_subject25/annotations/person_keypoints_val2017_mirrored.json"
  custom_hooks.3.dataloader.dataset.data_root: "data/webex-general-val/"
  custom_hooks.3.dataloader.dataset.ann_file: "annotations/general_val.json"
  custom_hooks.3.dataloader.dataset.data_prefix.img: "general_val/"
  custom_hooks.3.evaluator.ann_file: "data/webex-general-val/annotations/general_val.json"

experiments:
  - name: "v2_v4_subject25_unfreeze_stage3_lr3e-5"
    overrides:
      model.backbone.frozen_stages: 2
      optim_wrapper.optimizer.lr: 3.0e-5
      <<: *subject25

  - name: "v2_v4_subject25_unfreeze_stage4_lr3e-5"
    overrides:
      model.backbone.frozen_stages: 3
      optim_wrapper.optimizer.lr: 3.0e-5
      <<: *subject25

  - name: "v2_v4_subject25_unfreeze_stage3_lr1e-4"
    overrides:
      model.backbone.frozen_stages: 2
      <<: *subject25

  - name: "v2_v4_subject25_unfreeze_stage4_lr1e-4"
    overrides:
      model.backbone.frozen_stages: 3
      <<: *subject25

  - name: "v2_v4_subject25_unfreeze_stage3_lr3e-4"
    overrides:
      model.backbone.frozen_stages: 2
      optim_wrapper.optimizer.lr: 3.0e-4
      <<: *subject25

  - name: "v2_v4_subject25_unfreeze_stage4_lr3e-4"
    overrides:
      model.backbone.frozen_stages: 3
      optim_wrapper.optimizer.lr: 3.0e-4
      <<: *subject25
