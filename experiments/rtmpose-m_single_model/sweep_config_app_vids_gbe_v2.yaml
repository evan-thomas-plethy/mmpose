# =============================================================================
# Four subject folds under data/App_Vids_v2_GBE_v4_folds/.
# Each run trains on that fold's inner split. custom_hooks.4 and
# custom_hooks.5 each score one held-out person at
# <person>_held_out/held_out/. Train, val, and held-out
# frames are data/App_Vids_v1_GBE_v1_frames/. General val is
# data/webex-general-val/.
# =============================================================================
# Folds (held out):
#   evan_yordanos   EvanThomas, YordanosWoldebirhan
#   rishi_jamie     RishiArjun, JamieDoe
#   tim_nina        TimHall, NinaVani
#   anthony_joey    AnthonyGeorge, JoeyReyna
#
# Run with:
#   python experiments/run_sweep.py experiments/rtmpose-m_single_model/sweep_config_app_vids_gbe_v2.yaml
# =============================================================================

base_config: "configs/body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_coco-256x192_finetune.py"

