# =============================================================================
# Winning v4 setting on three InfiniteForm sizes mixed into the lying-person
# subject25 split. frozen_stages=2 trains stage3 and stage4. Base LR is 1e-4.
# Primary val and mirrored val are the val10 split. Held-out vals are
# annotations/seated_knee_extension_val.json and
# annotations/ground_based_exercises_val.json.
# Train and val frames are
# data/App_Vids_v1_GBE_v1_lyingperson_InfiniteForm_frames/. General val is
# data/webex-general-val/.
#
# experiments/v5.py hook layout: custom_hooks.2 is MirroredValHook,
# custom_hooks.3 is GeneralValHook, custom_hooks.4 is seated knee extension,
# and custom_hooks.5 is ground based exercises. experiments/v5_unfreeze.py
# adds the layer-wise LR constructor. Stage4 peaks at 1e-5 and stage3 at
# 5e-6. Cosine floors each group at 1% of its own peak.
# =============================================================================
# Run with:
#   python experiments/run_sweep.py experiments/rtmpose-m_single_model/sweep_config_app_vids_gbe_v5p1.yaml
# =============================================================================

base_config: "experiments/v5_unfreeze.py"

experiment_name: "rtmpose-m_finetune_ske_gbe_exercise_sets_val"

