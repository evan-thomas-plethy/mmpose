# =============================================================================
# Lying-person training on all four held-out folds. frozen_stages=2 trains
# stage3 and stage4. Base LR is 1e-4. Each run trains on
# <fold>_lyingperson and scores that fold's original inner val.
#
# Each held-out person is scored on the non-empty splits.
# held_out_<subject>_ske.json is seated_knee_extension.txt.
# held_out_<subject>_gbe.json is ground_based_exercises.txt.
# held_out_<subject>_non_ske_gbe.json is every other held-out frame.
# Empty files are omitted. Unused hook slots are enabled: false.
# Those files are written by data/make_held_out_ske_gbe_vals.py
# next to the original held-out val. The original val is not changed.
#
# Frames for train, inner val, and the held-out hooks are
# data/App_Vids_v1_GBE_v1_lyingperson_InfiniteForm_frames/. Fold dirs sit two
# levels under data/, so their prefix is ../../. Held-out dirs sit three
# levels under data/, so their prefix is ../../../. General val is
# data/webex-general-val/.
#
# experiments/v7.py hook layout: custom_hooks.2 is GeneralValHook.
# custom_hooks.3 through .8 score the non-empty held-out vals, in subject order.
# A fold with fewer than six vals sets the remaining hooks to enabled: false.
# Stage4 peaks at 1e-5 and stage3 at 5e-6.
# =============================================================================
# Run with:
#   python experiments/run_sweep.py experiments/rtmpose-m_single_model/sweep_config_app_vids_gbe_v7.yaml
# =============================================================================

