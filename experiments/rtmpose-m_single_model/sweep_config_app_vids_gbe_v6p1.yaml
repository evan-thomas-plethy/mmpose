# =============================================================================
# v5p2 x1 training on the v6 folds. frozen_stages=2 trains stage3 and stage4.
# Base LR is 1e-4. Each fold train JSON is drawn once, and
# Lying_Person_Dataset_Single_Ann.json is drawn once (RepeatDataset times=1).
#
# Val stays the original fold split. Held-out person hooks stay the original
# per-person sets. Frames for train, val, and those hooks are
# data/App_Vids_v1_GBE_v1_lyingperson_InfiniteForm_frames/. Fold dirs sit two
# levels under data/, so their prefix is ../../. The lying-person JSON sits
# one level under data/, so its prefix is ../. Held-out dirs sit three levels
# under data/, so their prefix is ../../../. General val is
# data/webex-general-val/.
#
# These folds have no mirrored val. experiments/v4.py has no MirroredValHook.
# custom_hooks.2 is GeneralValHook. custom_hooks.3 and custom_hooks.4
# each score one held-out person. experiments/v6p1_unfreeze.py adds the
# layer-wise LR constructor and the combined train set. Stage4 peaks at 1e-5
# and stage3 at 5e-6.
# =============================================================================
# Run with:
#   python experiments/run_sweep.py experiments/rtmpose-m_single_model/sweep_config_app_vids_gbe_v6p1.yaml
# =============================================================================

base_config: "experiments/v6p1_unfreeze.py"

experiment_name: "rtmpose-m_finetune_additional_datasets_4foldCV"

_frames: &frames "../../App_Vids_v1_GBE_v1_lyingperson_InfiniteForm_frames/"
_held_out_frames: &held_out_frames "../../../App_Vids_v1_GBE_v1_lyingperson_InfiniteForm_frames/"

_rishi_jamie: &rishi_jamie
  val_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_folds/rishi_jamie/"
  val_dataloader.dataset.data_prefix.img: *frames
  val_evaluator.ann_file: "data/App_Vids_v2_GBE_v4_folds/rishi_jamie/annotations/person_keypoints_val2017.json"
  test_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_folds/rishi_jamie/"
  test_dataloader.dataset.data_prefix.img: *frames
  test_evaluator.ann_file: "data/App_Vids_v2_GBE_v4_folds/rishi_jamie/annotations/person_keypoints_val2017.json"
  custom_hooks.2.dataloader.dataset.data_root: "data/webex-general-val/"
  custom_hooks.2.dataloader.dataset.ann_file: "annotations/general_val.json"
  custom_hooks.2.dataloader.dataset.data_prefix.img: "general_val/"
  custom_hooks.2.evaluator.ann_file: "data/webex-general-val/annotations/general_val.json"
  custom_hooks.3.metric_prefix: "held_out_rishi"
  custom_hooks.3.dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_folds/rishi_held_out/held_out/"
  custom_hooks.3.dataloader.dataset.ann_file: "annotations/person_keypoints_val2017.json"
  custom_hooks.3.dataloader.dataset.data_prefix.img: *held_out_frames
  custom_hooks.3.evaluator.ann_file: "data/App_Vids_v2_GBE_v4_folds/rishi_held_out/held_out/annotations/person_keypoints_val2017.json"
  custom_hooks.4.metric_prefix: "held_out_jamie"
  custom_hooks.4.dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_folds/jamie_held_out/held_out/"
  custom_hooks.4.dataloader.dataset.ann_file: "annotations/person_keypoints_val2017.json"
  custom_hooks.4.dataloader.dataset.data_prefix.img: *held_out_frames
  custom_hooks.4.evaluator.ann_file: "data/App_Vids_v2_GBE_v4_folds/jamie_held_out/held_out/annotations/person_keypoints_val2017.json"

_tim_nina: &tim_nina
  val_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_folds/tim_nina/"
  val_dataloader.dataset.data_prefix.img: *frames
  val_evaluator.ann_file: "data/App_Vids_v2_GBE_v4_folds/tim_nina/annotations/person_keypoints_val2017.json"
  test_dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_folds/tim_nina/"
  test_dataloader.dataset.data_prefix.img: *frames
  test_evaluator.ann_file: "data/App_Vids_v2_GBE_v4_folds/tim_nina/annotations/person_keypoints_val2017.json"
  custom_hooks.2.dataloader.dataset.data_root: "data/webex-general-val/"
  custom_hooks.2.dataloader.dataset.ann_file: "annotations/general_val.json"
  custom_hooks.2.dataloader.dataset.data_prefix.img: "general_val/"
  custom_hooks.2.evaluator.ann_file: "data/webex-general-val/annotations/general_val.json"
  custom_hooks.3.metric_prefix: "held_out_tim"
  custom_hooks.3.dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_folds/tim_held_out/held_out/"
  custom_hooks.3.dataloader.dataset.ann_file: "annotations/person_keypoints_val2017.json"
  custom_hooks.3.dataloader.dataset.data_prefix.img: *held_out_frames
  custom_hooks.3.evaluator.ann_file: "data/App_Vids_v2_GBE_v4_folds/tim_held_out/held_out/annotations/person_keypoints_val2017.json"
  custom_hooks.4.metric_prefix: "held_out_nina"
  custom_hooks.4.dataloader.dataset.data_root: "data/App_Vids_v2_GBE_v4_folds/nina_held_out/held_out/"
  custom_hooks.4.dataloader.dataset.ann_file: "annotations/person_keypoints_val2017.json"
  custom_hooks.4.dataloader.dataset.data_prefix.img: *held_out_frames
  custom_hooks.4.evaluator.ann_file: "data/App_Vids_v2_GBE_v4_folds/nina_held_out/held_out/annotations/person_keypoints_val2017.json"

experiments:
  - name: "rishi_jamie_lyingperson_x1_unfreeze_stage3_lr1e-4"
    overrides:
      model.backbone.frozen_stages: 2
      optim_wrapper.optimizer.lr: 1.0e-4
      train_dataloader.dataset.datasets.0.data_root: "data/App_Vids_v2_GBE_v4_folds/rishi_jamie/"
      train_dataloader.dataset.datasets.0.data_prefix.img: *frames
      train_dataloader.dataset.datasets.1.times: 1
      <<: *rishi_jamie

  - name: "tim_nina_lyingperson_x1_unfreeze_stage3_lr1e-4"
    overrides:
      model.backbone.frozen_stages: 2
      optim_wrapper.optimizer.lr: 1.0e-4
      train_dataloader.dataset.datasets.0.data_root: "data/App_Vids_v2_GBE_v4_folds/tim_nina/"
      train_dataloader.dataset.datasets.0.data_prefix.img: *frames
      train_dataloader.dataset.datasets.1.times: 1
      <<: *tim_nina
