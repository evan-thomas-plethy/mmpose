# =============================================================================
# Sweep v1 — merged dataset size (fully frozen backbone)
# =============================================================================
# One run per merged GBE v6 + LSPe dataset (2 seeds x 500/1000/2000 LSPe samples).
# Base config freezes backbone via per-stage custom_keys (lr_mult=0.0).
#
# MLflow runs:
#   seed1_n_lspe_{500,1000,2000}
#   seed2_n_lspe_{500,1000,2000}
#
# Run with: python experiments/run_sweep.py experiments/sweep_config_backbone_unfreeze_v1.yaml
# =============================================================================

base_config: "configs/body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_coco-256x192_finetune.py"

mlflow:
  tracking_uri: "http://52.41.68.196:5000"
  experiment_name: "rtmpose-m_merged_gbe_v6_lspe_sweep"

experiments:
  - name: "seed1_n_lspe_500"
    overrides:
      train_dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed1_n500/"
      val_dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed1_n500/"
      val_evaluator.ann_file: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed1_n500/annotations/person_keypoints_val2017.json"
      custom_hooks.2.dataloader.dataset.data_root: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed1_n500/"
      custom_hooks.2.evaluator.ann_file: "data/merged_gbe_v6_lspe/gbe_v6_lspe_seed1_n500/annotations/person_keypoints_val2017_mirrored.json"

  - name: "seed1_n_lspe_1000"
