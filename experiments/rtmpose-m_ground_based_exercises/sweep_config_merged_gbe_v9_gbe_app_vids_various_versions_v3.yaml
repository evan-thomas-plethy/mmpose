# =============================================================================
# Sweep v3 — GBE v9 + merged v9/app_vids v2/v3/v4 (full unfreeze, ld0.5, lr 1e-3)
# =============================================================================
# Four runs: same datasets as v1 excluding standalone gbe_app_vids_v2/v3/v4.
# Hyperparams: frozen_stages=-1, CSPNeXtLayerDecay ld0.5, base lr 1e-3.
#
# Prerequisites: same as v1 (see sweep_config_..._v1.yaml).
#
# Run with:
#   python experiments/run_sweep.py experiments/sweep_config_merged_gbe_v9_gbe_app_vids_various_versions_v3.yaml
# =============================================================================

base_config: "configs/body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_coco-256x192_finetune_unfreeze.py"

mlflow:
  tracking_uri: "http://52.41.68.196:5000"
  experiment_name: "rtmpose-m_merged_gbe_v9_gbe_app_vids_various_versions_sweep"

experiments:
  - name: "gbe_v9_unfreeze_full_ld0.5_lr1e-3"
    overrides:
      model.backbone.frozen_stages: -1
      optim_wrapper.optimizer.lr: 1e-3
      train_dataloader.dataset.data_root: "data/coco_ground_based_exercises_v9/"
      val_dataloader.dataset.data_root: "data/coco_ground_based_exercises_v9/"
      val_evaluator.ann_file: "data/coco_ground_based_exercises_v9/annotations/person_keypoints_val2017.json"
      custom_hooks.2.dataloader.dataset.data_root: "data/coco_ground_based_exercises_v9/"
      custom_hooks.2.evaluator.ann_file: "data/coco_ground_based_exercises_v9/annotations/person_keypoints_val2017_mirrored.json"
      custom_hooks.3.dataloader.dataset.data_root: "data/coco_ground_based_exercises_v9/"
      custom_hooks.3.evaluator.ann_file: "data/coco_ground_based_exercises_v9/annotations/person_keypoints_val2017_gbe_v9_only.json"

  - name: "merged_gbe_v9_app_vids_v2_unfreeze_full_ld0.5_lr1e-3"
    overrides:
      model.backbone.frozen_stages: -1
      optim_wrapper.optimizer.lr: 1e-3
      train_dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v2/"
      val_dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v2/"
      val_evaluator.ann_file: "data/merged_gbe_v9_gbe_app_vids_v2/annotations/person_keypoints_val2017.json"
      custom_hooks.2.dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v2/"
      custom_hooks.2.evaluator.ann_file: "data/merged_gbe_v9_gbe_app_vids_v2/annotations/person_keypoints_val2017_mirrored.json"
      custom_hooks.3.dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v2/"
      custom_hooks.3.evaluator.ann_file: "data/merged_gbe_v9_gbe_app_vids_v2/annotations/person_keypoints_val2017_gbe_v9_only.json"

  - name: "merged_gbe_v9_app_vids_v3_unfreeze_full_ld0.5_lr1e-3"
    overrides:
      model.backbone.frozen_stages: -1
      optim_wrapper.optimizer.lr: 1e-3
      train_dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v3/"
      val_dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v3/"
      val_evaluator.ann_file: "data/merged_gbe_v9_gbe_app_vids_v3/annotations/person_keypoints_val2017.json"
      custom_hooks.2.dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v3/"
      custom_hooks.2.evaluator.ann_file: "data/merged_gbe_v9_gbe_app_vids_v3/annotations/person_keypoints_val2017_mirrored.json"
      custom_hooks.3.dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v3/"
      custom_hooks.3.evaluator.ann_file: "data/merged_gbe_v9_gbe_app_vids_v3/annotations/person_keypoints_val2017_gbe_v9_only.json"

  - name: "merged_gbe_v9_app_vids_v4_unfreeze_full_ld0.5_lr1e-3"
    overrides:
      model.backbone.frozen_stages: -1
      optim_wrapper.optimizer.lr: 1e-3
      train_dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v4/"
      val_dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v4/"
      val_evaluator.ann_file: "data/merged_gbe_v9_gbe_app_vids_v4/annotations/person_keypoints_val2017.json"
      custom_hooks.2.dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v4/"
      custom_hooks.2.evaluator.ann_file: "data/merged_gbe_v9_gbe_app_vids_v4/annotations/person_keypoints_val2017_mirrored.json"
      custom_hooks.3.dataloader.dataset.data_root: "data/merged_gbe_v9_gbe_app_vids_v4/"
      custom_hooks.3.evaluator.ann_file: "data/merged_gbe_v9_gbe_app_vids_v4/annotations/person_keypoints_val2017_gbe_v9_only.json"
