# =============================================================================
# Hyperparameter Sweep Configuration
# =============================================================================
# Run with: python experiments/run_sweep.py experiments/sweep_config.yaml
# =============================================================================

# Base configuration file
base_config: "configs/body_2d_keypoint/rtmpose/coco/rtmpose-m_8xb256-420e_coco-256x192_finetune_long_train.py"

# MLflow settings
mlflow:
  tracking_uri: "http://35.91.197.8:5000"
  experiment_name: "rtmpose-m_ground_based_exercises_plus_heel_slides_lr_sweep"

experiments:
  - name: "lr_1e-5"
    overrides:
      base_lr: 1e-5
      optim_wrapper.optimizer.lr: 1e-5
      param_scheduler.1.eta_min: 1e-7

  - name: "lr_5e-5"
    overrides:
      base_lr: 5e-5
      optim_wrapper.optimizer.lr: 5e-5
      param_scheduler.1.eta_min: 5e-7

  - name: "lr_1e-4"
    overrides:
      base_lr: 1e-4
      optim_wrapper.optimizer.lr: 1e-4
      param_scheduler.1.eta_min: 1e-6

  - name: "lr_2e-4"
    overrides:
      base_lr: 2e-4
      optim_wrapper.optimizer.lr: 2e-4
      param_scheduler.1.eta_min: 2e-6

  - name: "lr_5e-4"
    overrides:
      base_lr: 5e-4
      optim_wrapper.optimizer.lr: 5e-4
      param_scheduler.1.eta_min: 5e-6

  - name: "lr_1e-3"
    overrides:
      base_lr: 1e-3
      optim_wrapper.optimizer.lr: 1e-3
      param_scheduler.1.eta_min: 1e-5

  - name: "lr_2e-3"
    overrides:
      base_lr: 2e-3
      optim_wrapper.optimizer.lr: 2e-3
      param_scheduler.1.eta_min: 2e-5

  - name: "lr_5e-3"
    overrides:
      base_lr: 5e-3
      optim_wrapper.optimizer.lr: 5e-3
      param_scheduler.1.eta_min: 5e-5

